services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - cafe-mysql:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, '127.0.0.1', --silent]
      interval: 10s
      timeout: 5s
      retries: 15
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DEV_DEMO: '0'
      HOST: 0.0.0.0
      MYSQL_HOST: database
      MYSQL_SOCKET: ''
    expose:
      - '4000'
    depends_on:
      database:
        condition: service_healthy
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your domain name}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  cafe-mysql:
  caddy-data:
  caddy-config:
