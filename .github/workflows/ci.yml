name: Validate Cafe
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx expo install --check
      - run: npx expo export --platform ios --platform android --output-dir native-export
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cafe-web
          path: dist
